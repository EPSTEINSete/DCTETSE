<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPSTEIN 22</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela de Login -->
  <div id="login-screen">
    <div class="login-card">
      <h1>EPSTEIN 22</h1>
      <p>Boas-vindas de volta!</p>
      <input type="text" id="name-input" placeholder="Digite seu apelido..." autofocus maxlength="20">
      <button id="join-btn">Entrar</button>
    </div>
  </div>

  <!-- App Interface -->
  <div id="app-screen" style="display: none;">
    <!-- Barra da Esquerda (Ícone do Servidor) -->
    <div class="guilds-rail">
      <div class="guild-icon" title="EPSTEIN 22">EP</div>
    </div>

    <!-- Sidebar do Servidor -->
    <div class="sidebar">
      <div style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <div class="server-header">
          <span>EPSTEIN 22</span>
          <span>∨</span>
        </div>

        <div class="channel-container">
          <div class="section-title">
            <span>Canais de texto</span>
            <button id="add-text-channel-btn" title="Criar Canal">+</button>
          </div>
          <ul id="text-channel-list"></ul>

          <div class="section-title">
            <span>Canais de voz</span>
            <button id="add-voice-channel-btn" title="Criar Canal">+</button>
          </div>
          <ul id="voice-channel-list"></ul>
        </div>
      </div>

      <!-- Rodapé (Card de Voz e Perfil) -->
      <div>
        <div id="voice-status-panel">
          <div class="voice-info">
            <div class="voice-details">
              <span class="status-text">📡 Voz conectada</span>
              <span class="channel-connected" id="connected-channel-name">/ EPSTEIN 22</span>
            </div>
            <button class="hangup-btn" id="disconnect-voice-btn" title="Desconectar">✕</button>
          </div>
        </div>

        <div class="user-panel">
          <div class="user-info">
            <div class="avatar" id="my-avatar">U</div>
            <span class="user-name" id="my-name-display">Você</span>
          </div>
          <div class="control-buttons">
            <button class="icon-btn" id="screen-btn" disabled title="Compartilhar Tela">🖥️</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Central -->
    <div class="chat-area">
      <div class="chat-header" id="channel-title"># geral</div>
      <div id="screen-grid"></div>
      <div id="messages"></div>
      <form id="chat-form">
        <div class="input-wrapper">
          <input type="text" id="chat-input" placeholder="Conversar em #geral" autocomplete="off">
        </div>
      </form>
    </div>

    <!-- Sidebar de Membros -->
    <div class="members-sidebar">
      <div class="member-group-title">ONLINE</div>
      <ul id="users"></ul>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
