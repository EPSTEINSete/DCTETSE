<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPSTEIN 22</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela de Login -->
  <div id="login-screen">
    <div class="login-card">
      <h1>EPSTEIN 22</h1>
      <p>Digite seu apelido para entrar</p>
      <input type="text" id="name-input" placeholder="Seu apelido..." autofocus maxlength="20">
      <button id="join-btn">Entrar</button>
    </div>
  </div>

  <!-- Tela Principal do App -->
  <div id="app-screen" style="display: none;">
    <div class="sidebar">
      <div class="server-title">EPSTEIN 22</div>
      
      <div class="section-title">
        <span>CANAIS DE TEXTO</span>
        <button id="add-text-channel-btn" title="Criar canal de texto">+</button>
      </div>
      <ul id="text-channel-list"></ul>

      <div class="section-title">
        <span>CANAIS DE VOZ</span>
        <button id="add-voice-channel-btn" title="Criar canal de voz">+</button>
      </div>
      <ul id="voice-channel-list"></ul>

      <div class="section-title">MEMBROS ONLINE</div>
      <ul id="users"></ul>

      <div class="user-panel">
        <span id="my-name-display">Você</span>
        <button id="screen-btn" disabled>🖥️ Compartilhar tela</button>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="channel-title">EPSTEIN 22 — #geral</div>
      <div id="screen-grid"></div>
      <div id="messages"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Enviar mensagem..." autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
